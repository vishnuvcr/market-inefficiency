name: Research Protocol Check

on:
  push:
    branches: ["main", "research/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check "pandas>=2.2,<3" "scipy>=1.13,<2"
      - name: Validate repository protocol
        run: python scripts/validate_protocol.py
      - name: Validate Phase 2 data contract
        run: python scripts/validate_data_schema.py
      - name: Validate Phase 2 synthetic fixture
        run: python scripts/validate_phase2_fixture.py
      - name: Test NSE F&O EOD normalization adapter
        run: python scripts/test_nse_fo_eod_adapter.py
      - name: Test Kaggle NIFTY normalization adapter
        run: python scripts/test_kaggle_nifty_adapter.py
      - name: Test Phase 2 quality and contract reconciliation
        run: python scripts/test_phase2_quality_and_contracts.py
      - name: Test immutable snapshot manifest
        run: python scripts/test_snapshot_manifest.py
      - name: Test Phase 3.1 stylized-fact diagnostics
        run: python scripts/test_phase3_stylized_facts.py
      - name: Test Phase 3.2 realized-volatility diagnostics
        run: python scripts/test_phase3_realized_volatility.py
      - name: Test Phase 3.3 volatility-persistence diagnostics
        run: python scripts/test_phase3_volatility_persistence.py
      - name: Test Phase 3.4 jump diagnostics
        run: python scripts/test_phase3_jump_diagnostics.py
      - name: Test Phase 3.5 memory/dependence diagnostics
        run: python scripts/test_phase3_memory_dependence.py
      - name: Test Phase 3.6 descriptive regime segmentation
        run: python scripts/test_phase3_regime_segmentation.py
      - name: Test Phase 3.7 discovery diagnostics
        run: python scripts/test_phase3_7_discovery.py
      - name: Publish research configuration artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-protocol-${{ github.sha }}
          path: |
            RESEARCH_PLAN.md
            STATUS.md
            config/research_config.json
            config/data_schema.json
            docs/HYPOTHESES.md
            docs/VALIDATION_FRAMEWORK.md
            docs/DATA_SPECIFICATION.md
            docs/KAGGLE_DATA_SOURCES.md

  nse-data-probe:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check requests pandas
      - name: Probe public NSE historical option interface
        run: python scripts/probe_nse_fno_historical.py
      - name: Probe NIFTY option cross-section query
        run: python scripts/probe_nse_option_surface.py
      - name: Validate NSE UDiFF Common Bhavcopy route
        run: python scripts/probe_nse_udiff_bhavcopy.py
      - name: Upload NSE probe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nse-data-probe-${{ github.sha }}
          path: data/nse_probe/*.json
          if-no-files-found: error

  nse-option-pilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install acquisition dependencies
        run: python -m pip install --disable-pip-version-check requests pandas
      - name: Acquire bounded NIFTY OPTIDX snapshot
        run: python scripts/acquire_nse_nifty_optidx.py --start 2026-05-01 --end 2026-05-14
      - name: Validate acquired snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("data/nse_option_snapshot/MANIFEST.json").read_text())
          assert x["validated_days"] > 0, x
          assert x["error_days"] == 0, x
          assert x["raw_preserved"] is True
          print("NSE NIFTY OPTIDX pilot: PASS")
          print("validated_days:", x["validated_days"])
          print("no_archive_days:", x["no_archive_days"])
          PY
      - name: Upload NIFTY OPTIDX pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: nse-nifty-optidx-pilot-${{ github.sha }}
          path: data/nse_option_snapshot/
          if-no-files-found: error
