name: Research Protocol Check

on:
  push:
    branches: ["main", "research/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check "pandas>=2.2,<3" "scipy>=1.13,<2"
      - name: Validate repository protocol
        run: python scripts/validate_protocol.py
      - name: Validate Phase 2 data contract
        run: python scripts/validate_data_schema.py
      - name: Validate Phase 2 synthetic fixture
        run: python scripts/validate_phase2_fixture.py
      - name: Test NSE F&O EOD normalization adapter
        run: python scripts/test_nse_fo_eod_adapter.py
      - name: Test NIFTY contract-level lot-size mapper
        run: python scripts/test_nifty_contract_master.py
      - name: Test Kaggle NIFTY normalization adapter
        run: python scripts/test_kaggle_nifty_adapter.py
      - name: Test Phase 2 quality and contract reconciliation
        run: python scripts/test_phase2_quality_and_contracts.py
      - name: Test immutable snapshot manifest
        run: python scripts/test_snapshot_manifest.py
      - name: Test Phase 3.1 stylized-fact diagnostics
        run: python scripts/test_phase3_stylized_facts.py
      - name: Test Phase 3.2 realized-volatility diagnostics
        run: python scripts/test_phase3_realized_volatility.py
      - name: Test Phase 3.3 volatility-persistence diagnostics
        run: python scripts/test_phase3_volatility_persistence.py
      - name: Test Phase 3.4 jump diagnostics
        run: python scripts/test_phase3_jump_diagnostics.py
      - name: Test Phase 3.5 memory/dependence diagnostics
        run: python scripts/test_phase3_memory_dependence.py
      - name: Test Phase 3.6 descriptive regime segmentation
        run: python scripts/test_phase3_regime_segmentation.py
      - name: Test Phase 3.7 discovery diagnostics
        run: python scripts/test_phase3_7_discovery.py
      - name: Publish research configuration artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-protocol-${{ github.sha }}
          path: |
            RESEARCH_PLAN.md
            STATUS.md
            config/research_config.json
            config/data_schema.json
            docs/HYPOTHESES.md
            docs/VALIDATION_FRAMEWORK.md
            docs/DATA_SPECIFICATION.md
            docs/KAGGLE_DATA_SOURCES.md

  nse-data-probe:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check requests pandas
      - name: Probe public NSE historical option interface
        run: python scripts/probe_nse_fno_historical.py
      - name: Probe NIFTY option cross-section query
        run: python scripts/probe_nse_option_surface.py
      - name: Validate NSE UDiFF Common Bhavcopy route
        run: python scripts/probe_nse_udiff_bhavcopy.py
      - name: Upload NSE probe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nse-data-probe-${{ github.sha }}
          path: data/nse_probe/*.json
          if-no-files-found: error

  nse-option-pilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install acquisition dependencies
        run: python -m pip install --disable-pip-version-check requests pandas
      - name: Acquire bounded NIFTY OPTIDX snapshot
        run: python scripts/acquire_nse_nifty_optidx.py --start 2026-05-01 --end 2026-05-14
      - name: Validate acquired snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("data/nse_option_snapshot/MANIFEST.json").read_text())
          assert x["validated_days"] > 0, x
          assert x["error_days"] == 0, x
          assert x["raw_preserved"] is True
          print("NSE NIFTY OPTIDX pilot: PASS")
          print("validated_days:", x["validated_days"])
          print("no_archive_days:", x["no_archive_days"])
          PY
      - name: Upload NIFTY OPTIDX pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: nse-nifty-optidx-pilot-${{ github.sha }}
          path: data/nse_option_snapshot/
          if-no-files-found: error

  phase5-multimodal-prediction:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Phase 5 dependencies
        run: python -m pip install --disable-pip-version-check "pandas>=2.2,<3" "numpy>=1.26,<3" "scipy>=1.13,<2" "scikit-learn>=1.5,<2"
      - name: Download frozen Phase 4B IV artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${RUNNER_TEMP}/iv_artifact"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -o "${RUNNER_TEMP}/iv.zip" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10567387234/zip"
          unzip -q "${RUNNER_TEMP}/iv.zip" -d "${RUNNER_TEMP}/iv_artifact"
          test -n "$(find "${RUNNER_TEMP}/iv_artifact" -name 'iv_observations_*.csv.gz' -print -quit)"
      - name: Download frozen official NIFTY artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${RUNNER_TEMP}/underlying_artifact"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -o "${RUNNER_TEMP}/underlying.zip" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10564212363/zip"
          unzip -q "${RUNNER_TEMP}/underlying.zip" -d "${RUNNER_TEMP}/underlying_artifact"
          UNDERLYING="$(find "${RUNNER_TEMP}/underlying_artifact" -type f \( -name 'nifty50_ohlc.csv' -o -name '*nifty50*ohlc*.csv' \) -print -quit)"
          test -n "${UNDERLYING}"
          echo "UNDERLYING=${UNDERLYING}" >> "${GITHUB_ENV}"
      - name: Run broad Phase 5 prediction
        run: |
          python scripts/phase5_multimodal_prediction.py \
            --iv-root "${RUNNER_TEMP}/iv_artifact" \
            --underlying "${UNDERLYING}" \
            --output "${RUNNER_TEMP}/phase5"
      - name: Validate Phase 5 report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import os
          r=json.loads((Path(os.environ["RUNNER_TEMP"]) / "phase5" / "PHASE5_PREDICTION_REPORT.json").read_text())
          assert r["status"]=="PASS", r
          assert r["sample"]["holdout_rows"] >= 100, r
          assert r["models"]["multimodal"]["direction_holdout"]["auc"] == r["models"]["multimodal"]["direction_holdout"]["auc"], r
          print("PHASE5_MULTIMODAL: PASS")
          print(json.dumps({
              "holdout": r["sample"],
              "auc": r["models"]["multimodal"]["direction_holdout"]["auc"],
              "brier": r["models"]["multimodal"]["direction_holdout"]["brier"],
              "cost_sensitivity": r["models"]["multimodal"]["direction_strategy_proxy"]["cost_sensitivity"]
          }, indent=2))
          PY
      - name: Upload Phase 5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase5-multimodal-prediction-${{ github.sha }}
          path: ${{ runner.temp }}/phase5
          retention-days: 90

  phase6-strategy-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Phase 6 dependencies
        run: python -m pip install --disable-pip-version-check "pandas>=2.2,<3" "numpy>=1.26,<3" "scipy>=1.13,<2" "scikit-learn>=1.5,<2"
      - name: Download frozen Phase 4B IV artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${RUNNER_TEMP}/iv_artifact"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -o "${RUNNER_TEMP}/iv.zip" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10567387234/zip"
          unzip -q "${RUNNER_TEMP}/iv.zip" -d "${RUNNER_TEMP}/iv_artifact"
          test -n "$(find "${RUNNER_TEMP}/iv_artifact" -name 'iv_observations_*.csv.gz' -print -quit)"
      - name: Download frozen official NIFTY artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${RUNNER_TEMP}/underlying_artifact"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -o "${RUNNER_TEMP}/underlying.zip" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10564212363/zip"
          unzip -q "${RUNNER_TEMP}/underlying.zip" -d "${RUNNER_TEMP}/underlying_artifact"
          UNDERLYING="$(find "${RUNNER_TEMP}/underlying_artifact" -type f \( -name 'nifty50_ohlc.csv' -o -name '*nifty50*ohlc*.csv' \) -print -quit)"
          test -n "${UNDERLYING}"
          echo "UNDERLYING=${UNDERLYING}" >> "${GITHUB_ENV}"
      - name: Run Phase 6 strategy screen
        run: |
          python scripts/phase6_strategy_screen.py \
            --iv-root "${RUNNER_TEMP}/iv_artifact" \
            --underlying "${UNDERLYING}" \
            --output "${RUNNER_TEMP}/phase6"
      - name: Validate Phase 6 report
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"]) / "phase6" / "PHASE6_STRATEGY_SCREEN_REPORT.json").read_text())
          assert r["status"]=="PASS", r
          assert r["split"]["final_holdout_n"] >= 50, r
          assert r["validation_selection"]["selected_candidate"] in r["candidate_set"], r
          print("PHASE6_STRATEGY_SCREEN: PASS")
          print(json.dumps({
              "selected_candidate": r["validation_selection"]["selected_candidate"],
              "validation_sharpe": r["validation_selection"]["candidate_metrics"][r["validation_selection"]["selected_candidate"]]["sharpe"],
              "final": r["final_holdout"]["selected_candidate_cost_sensitivity"]
          }, indent=2))
          PY
      - name: Upload Phase 6 artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase6-strategy-screen-${{ github.sha }}
          path: ${{ runner.temp }}/phase6
          retention-days: 90

  phase7-statistical-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Phase 7 dependencies
        run: python -m pip install --disable-pip-version-check "pandas>=2.2,<3" "numpy>=1.26,<3" "scipy>=1.13,<2" "scikit-learn>=1.5,<2"
      - name: Download frozen Phase 4B IV artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${RUNNER_TEMP}/iv_artifact"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -o "${RUNNER_TEMP}/iv.zip" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10567387234/zip"
          unzip -q "${RUNNER_TEMP}/iv.zip" -d "${RUNNER_TEMP}/iv_artifact"
          test -n "$(find "${RUNNER_TEMP}/iv_artifact" -name 'iv_observations_*.csv.gz' -print -quit)"
      - name: Download frozen official NIFTY artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${RUNNER_TEMP}/underlying_artifact"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -o "${RUNNER_TEMP}/underlying.zip" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10564212363/zip"
          unzip -q "${RUNNER_TEMP}/underlying.zip" -d "${RUNNER_TEMP}/underlying_artifact"
          UNDERLYING="$(find "${RUNNER_TEMP}/underlying_artifact" -type f \( -name 'nifty50_ohlc.csv' -o -name '*nifty50*ohlc*.csv' \) -print -quit)"
          test -n "${UNDERLYING}"
          echo "UNDERLYING=${UNDERLYING}" >> "${GITHUB_ENV}"
      - name: Run Phase 7 statistical validation
        run: |
          python scripts/phase7_statistical_validation.py \
            --iv-root "${RUNNER_TEMP}/iv_artifact" \
            --underlying "${UNDERLYING}" \
            --output "${RUNNER_TEMP}/phase7"
      - name: Validate Phase 7 report
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"]) / "phase7" / "PHASE7_STATISTICAL_VALIDATION_REPORT.json").read_text())
          assert r["status"]=="PASS", r
          assert r["cpcv"]["paths"] >= 20, r
          assert r["data_partition"]["final_holdout_rows_reserved"] > 100, r
          print("PHASE7_STATISTICAL_VALIDATION: PASS")
          print(json.dumps({
              "paths": r["cpcv"]["paths"],
              "pbo_proxy": r["pbo"]["pbo_proxy"],
              "cpcv_median_sharpe_10bps": r["dsr_approximation"]["cpcv_median_sharpe_10bps"],
              "dsr_approx": r["dsr_approximation"]["approx_probability_sharpe_exceeds_hurdle"]
          }, indent=2))
          PY
      - name: Upload Phase 7 artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase7-statistical-validation-${{ github.sha }}
          path: ${{ runner.temp }}/phase7
          retention-days: 90
