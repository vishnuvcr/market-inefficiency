name: Acquire historical NIFTY OPTIDX EOD partitions

on:
  workflow_dispatch:
  push:
    branches:
      - research/v1.0-protocol
    paths:
      - "scripts/acquire_nse_nifty_optidx.py"
      - "scripts/validate_nse_nifty_optidx_snapshot.py"
      - ".github/workflows/acquire-nifty-optidx-historical.yml"

permissions:
  contents: read

concurrency:
  group: nse-nifty-optidx-historical
  cancel-in-progress: false

jobs:
  acquire-year:
    name: "Acquire ${{ matrix.year }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        year: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pandas

      - name: Resolve partition dates
        id: dates
        env:
          YEAR: ${{ matrix.year }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import date
          y=int(os.environ["YEAR"])
          start=date(y,1,1)
          end=date(y,12,31)
          if y==2026:
              end=date(2026,5,14)
          print("start="+start.isoformat())
          print("end="+end.isoformat())
          PY

      - name: Acquire yearly NIFTY option partition
        run: |
          rm -rf "data/nse_option_snapshot"
          python scripts/acquire_nse_nifty_optidx.py \
            --start "${{ steps.dates.outputs.start }}" \
            --end "${{ steps.dates.outputs.end }}" \
            --workers 2 \
            --retries 2

      - name: Validate yearly partition
        run: |
          python scripts/validate_nse_nifty_optidx_snapshot.py \
            --root data/nse_option_snapshot \
            --output data/nse_option_snapshot/VALIDATION.json
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("data/nse_option_snapshot/MANIFEST.json").read_text())
          v=json.loads(Path("data/nse_option_snapshot/VALIDATION.json").read_text())
          assert m["error_days"] == 0, m
          assert v["status"] == "PASS", v
          print("Partition PASS")
          print("validated_days =", m["validated_days"])
          print("no_archive_days =", m["no_archive_days"])
          print("validation_rows =", v["checks"]["rows"])
          PY

      - name: Upload immutable yearly partition
        uses: actions/upload-artifact@v4
        with:
          name: nse-nifty-optidx-${{ matrix.year }}-${{ github.sha }}
          path: data/nse_option_snapshot/
          if-no-files-found: error
          retention-days: 90
