name: Phase 12 — execution simulator validation

on:
  push:
    branches: [research/phase9-surface-execution]
    paths:
      - scripts/phase12_execution_simulator.py
      - scripts/phase12_quote_audit.py
      - scripts/phase12_quote_normalizer.py
      - tests/test_phase12_execution_simulator.py
      - tests/test_phase12_quote_normalizer.py
      - tests/fixtures/tickbytes_nifty_opt_sample.csv
      - tests/fixtures/optionvault_nifty_level2_sample.csv
      - .github/workflows/phase12-execution-simulator.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "pytest>=8,<9" "numpy>=1.26,<3" "scipy>=1.13,<2"
      - run: pytest -q tests/test_phase10_execution_parser.py tests/test_phase11_strategy_library.py tests/test_phase12_execution_simulator.py tests/test_phase12_quote_normalizer.py
      - run: python scripts/phase12_quote_audit.py tests/fixtures/tickbytes_nifty_opt_sample.csv
      - run: python scripts/phase12_quote_audit.py tests/fixtures/optionvault_nifty_level2_sample.csv
