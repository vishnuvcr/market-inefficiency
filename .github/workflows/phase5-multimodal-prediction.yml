name: Phase 5 — broad multimodal prediction engine

on:
  push:
    branches: [research/v1.0-protocol]
    paths:
      - "scripts/phase5_multimodal_prediction.py"
      - "docs/PHASE5_PROTOCOL.md"
      - ".github/workflows/phase5-multimodal-prediction.yml"
      - "STATUS.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  phase5:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn
      - name: Download frozen Phase 4B IV artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${RUNNER_TEMP}/iv_artifact"
          curl -fsSL             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -o "${RUNNER_TEMP}/iv.zip"             "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10567387234/zip"
          unzip -q "${RUNNER_TEMP}/iv.zip" -d "${RUNNER_TEMP}/iv_artifact"
          test -n "$(find "${RUNNER_TEMP}/iv_artifact" -name 'iv_observations_*.csv.gz' -print -quit)"
      - name: Download frozen official NIFTY artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${RUNNER_TEMP}/underlying_artifact"
          curl -fsSL             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -o "${RUNNER_TEMP}/underlying.zip"             "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10564212363/zip"
          unzip -q "${RUNNER_TEMP}/underlying.zip" -d "${RUNNER_TEMP}/underlying_artifact"
          UNDERLYING="$(find "${RUNNER_TEMP}/underlying_artifact" -type f \( -name 'nifty50_ohlc.csv' -o -name '*nifty50*ohlc*.csv' \) -print -quit)"
          test -n "${UNDERLYING}"
          echo "UNDERLYING=${UNDERLYING}" >> "${GITHUB_ENV}"
      - name: Run Phase 5
        run: |
          python scripts/phase5_multimodal_prediction.py             --iv-root "${RUNNER_TEMP}/iv_artifact"             --underlying "${UNDERLYING}"             --output "${RUNNER_TEMP}/phase5"
      - name: Validate report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("${RUNNER_TEMP}/phase5/PHASE5_PREDICTION_REPORT.json")
          r=json.loads(p.read_text())
          assert r["status"]=="PASS"
          assert r["sample"]["holdout_rows"]>=100
          assert r["models"]["multimodal"]["direction_holdout"]["auc"] == r["models"]["multimodal"]["direction_holdout"]["auc"]
          print("PHASE5_REPORT_VALID")
          PY
      - name: Upload Phase 5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase5-multimodal-prediction-${{ github.sha }}
          path: ${{ runner.temp }}/phase5
          retention-days: 90
