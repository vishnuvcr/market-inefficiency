name: Phase 11 — strategy library validation

on:
  push:
    branches:
      - research/phase9-surface-execution
    paths:
      - scripts/phase11_strategy_library.py
      - tests/test_phase11_strategy_library.py
      - .github/workflows/phase11-strategy-library.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase11-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "pytest>=8,<9" "numpy>=1.26,<3" "scipy>=1.13,<2"
      - run: pytest -q tests/test_phase10_execution_parser.py tests/test_phase11_strategy_library.py
